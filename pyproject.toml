[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudledger"
version = "0.1.0"
description = "Cloud billing variance analysis — ingest, normalize, attribute, and visualize month-over-month cost changes."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "python-multipart>=0.0.6",
    "reportlab>=4.1",
    "requests>=2.31",
    "boto3>=1.34",
    "anthropic>=0.39.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.2", "httpx>=0.27"]
mcp = ["mcp[cli]>=1.0.0"]
snowflake = ["snowflake-connector-python>=3.6"]

[tool.setuptools.packages.find]
include = ["cloudledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["cloudledger", "backend"]
omit = ["*/venv/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 120
